<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1c35"/>
      <stop offset="0.55" stop-color="#0e3a6b"/>
      <stop offset="1" stop-color="#1b78c8"/>
    </linearGradient>
    <radialGradient id="glowA" cx="18%" cy="14%" r="48%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="86%" cy="90%" r="52%">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.1"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="url(#base)"/>
  <rect width="1200" height="900" fill="url(#glowA)"/>
  <rect width="1200" height="900" fill="url(#glowB)"/>
  <rect width="1200" height="900" fill="url(#dots)"/>

  <g fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="2">
    <circle cx="930" cy="640" r="150"/>
