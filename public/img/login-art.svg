    <circle cx="930" cy="640" r="350"/>
    <circle cx="930" cy="640" r="450"/>
  </g>

  <g fill="#ffffff" fill-opacity="0.12" transform="translate(930 640)">
    <rect x="-28" y="-118" width="56" height="236" rx="16"/>
    <rect x="-118" y="-28" width="236" height="56" rx="16"/>
  </g>

  <g fill="none" stroke="#7dd3fc" stroke-linecap="round" stroke-linejoin="round">
    <polyline stroke-opacity="0.18" stroke-width="10" points="0,470 260,470 320,470 350,400 385,540 420,330 455,500 480,470 700,470 760,470 800,430 830,500 860,470 1200,470"/>
    <polyline stroke-opacity="0.6" stroke-width="3" points="0,470 260,470 320,470 350,400 385,540 420,330 455,500 480,470 700,470 760,470 800,430 830,500 860,470 1200,470"/>
  </g>

  <g fill="#ffffff" fill-opacity="0.07">
