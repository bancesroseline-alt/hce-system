<div class="login-page">

  <!-- Fotos que se suceden (colores reales) y se difuminan hacia el azul del sistema -->
  <div class="slides" aria-hidden="true">
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>
  </div>

  <section class="login-right">

    <div class="login-card">

      <div class="logo">
        <span class="logo-mark">H</span>
        <strong class="logo-name">HCE System</strong>
        <small class="logo-tag">Historia clínica electrónica</small>
      </div>

      <form (ngSubmit)="login()">

        <div class="input-group">
          <label for="usuario">Usuario <span class="req">*</span></label>
          <input
            id="usuario"
            type="text"
            placeholder="Ingresa tu usuario"
            autocomplete="username"
            [(ngModel)]="username"
            name="username"
            required
          />
        </div>

        <div class="input-group">
          <label for="clave">Contraseña <span class="req">*</span></label>
          <div class="password-field">
            <input
              id="clave"
              [type]="verPassword ? 'text' : 'password'"
              placeholder="Ingresa tu contraseña"
              autocomplete="current-password"
              [(ngModel)]="password"
              name="password"
              required
            />
            <button
              type="button"
              class="toggle"
              (click)="verPassword = !verPassword"
              [attr.aria-label]="verPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
              {{ verPassword ? 'Ocultar' : 'Mostrar' }}
            </button>
          </div>
        </div>

        <div class="info" *ngIf="loading && estado">
          {{ estado }}
        </div>

        <div class="error" *ngIf="error">
          {{ error }}
        </div>

        <button type="submit" class="submit" [disabled]="loading">
          <span class="spin" *ngIf="loading"></span>
          {{ loading ? 'Ingresando...' : 'Iniciar sesión' }}
        </button>

      </form>

      <div class="connection-line" [ngClass]="conexion.estado">
        <app-connection-badge></app-connection-badge>
        <span>{{ textoConexion() }}</span>
      </div>

    </div>

  </section>

  <small class="page-footer">© 2026 HCE System. Todos los derechos reservados.</small>

</div>
