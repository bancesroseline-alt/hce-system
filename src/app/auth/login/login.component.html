<div class="login-page">

  <!-- PANEL IZQUIERDO: solo imagen y color -->
  <aside class="login-left" aria-hidden="true"></aside>

  <!-- PANEL DERECHO -->
  <section class="login-right">

    <div class="login-card">

      <div class="mobile-brand">
        <span class="brand-mark">H</span>
        <span>HCE System</span>
      </div>

      <div class="login-header">
        <h2>Bienvenido</h2>
        <p>Ingresa tus credenciales para continuar</p>
      </div>

      <form (ngSubmit)="login()">

        <div class="input-group">
          <label for="usuario">Usuario</label>
          <input
            id="usuario"
            type="text"
            placeholder="Ingresa tu usuario"
            autocomplete="username"
            [(ngModel)]="username"
            name="username"
            required
          />
        </div>

        <div class="input-group">
          <label for="clave">Contraseña</label>
          <div class="password-field">
            <input
              id="clave"
              [type]="verPassword ? 'text' : 'password'"
              placeholder="Ingresa tu contraseña"
              autocomplete="current-password"
              [(ngModel)]="password"
              name="password"
              required
            />
            <button
              type="button"
              class="toggle"
              (click)="verPassword = !verPassword"
              [attr.aria-label]="verPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
              {{ verPassword ? 'Ocultar' : 'Mostrar' }}
            </button>
          </div>
        </div>

        <div class="info" *ngIf="loading && estado">
          {{ estado }}
        </div>

        <div class="error" *ngIf="error">
          {{ error }}
        </div>

        <button type="submit" class="submit" [disabled]="loading">
          <span class="spin" *ngIf="loading"></span>
          {{ loading ? 'Ingresando...' : 'Ingresar' }}
        </button>

      </form>

      <div class="connection-line" [ngClass]="conexion.estado">
        <app-connection-badge></app-connection-badge>
        <span>{{ textoConexion() }}</span>
      </div>

    </div>

  </section>

</div>
